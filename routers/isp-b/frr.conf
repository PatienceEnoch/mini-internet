frr defaults traditional
hostname isp-b
log stdout
service integrated-vtysh-config
!
interface lo
 ip address 10.200.2.1/32
exit
!
ip prefix-list LAB-ROUTES seq 10 permit 10.200.1.1/32
ip prefix-list LAB-ROUTES seq 20 permit 10.200.2.1/32
ip prefix-list LAB-ROUTES seq 30 permit 10.200.3.1/32
!
router bgp 65002
 bgp router-id 10.200.2.1
 bgp log-neighbor-changes
 neighbor 10.200.12.2 remote-as 65001
 neighbor 10.200.12.2 description ISP-A
 neighbor 10.200.23.3 remote-as 65003
 neighbor 10.200.23.3 description ISP-C
 !
 address-family ipv4 unicast
  network 10.200.2.1/32
  neighbor 10.200.12.2 prefix-list LAB-ROUTES in
  neighbor 10.200.12.2 prefix-list LAB-ROUTES out
  neighbor 10.200.23.3 prefix-list LAB-ROUTES in
  neighbor 10.200.23.3 prefix-list LAB-ROUTES out
 exit-address-family
exit
!
